name: CT - Telecom Churn ML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  continuous-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Model Loading
        run: |
          python -c "import joblib; model = joblib.load('churn_model.pkl'); print('Model loaded successfully')"

      - name: Test App Import
        run: |
          python -c "import app; print('App imported successfully')"